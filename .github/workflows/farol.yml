name: Farol

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 12 * * 1"

jobs:
  harvest:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run harvest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HARVEST_KEY: farol-colheita-jp-2026
          HARVEST_RENDER_URL: https://farolqueprotege.com.br/api/colheita
      - name: Grava a colheita
        run: |
          git config user.name "farol-harvest"
          git config user.email "harvest@farolqueprotege.com.br"
          git add src/data/harvested.ts
          git diff --cached --quiet && echo "sem mudança" && exit 0
          git commit -m "Colheita semanal da mesa $(date -u +%Y-%m-%d)"
          git push

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:rumo
      - run: npm run test:base
      - run: node scripts/audit-secrets.mjs

  deploy:
    needs: audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:cf
